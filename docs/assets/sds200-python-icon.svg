<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">sds200-python neon icon</title>
  <desc id="desc">A fluorescent green futuristic desktop scanner showing generic scanning status.</desc>
  <defs>
