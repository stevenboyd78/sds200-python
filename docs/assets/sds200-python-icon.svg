      <stop offset="0" stop-color="#182018"/>
      <stop offset=".48" stop-color="#080c08"/>
      <stop offset="1" stop-color="#151d15"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10250a"/>
      <stop offset="1" stop-color="#030803"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#7CFF00" opacity=".08"/>
    </pattern>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="82" fill="#030603" stroke="#7CFF00" stroke-width="3"/>
