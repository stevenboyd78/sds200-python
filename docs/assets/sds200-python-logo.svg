<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">sds200-python neon logo</title>
  <desc id="desc">A futuristic fluorescent green desktop scanner with generic monitoring status and the sds200-python wordmark.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182018"/>
      <stop offset=".48" stop-color="#080c08"/>
      <stop offset="1" stop-color="#151d15"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10250a"/>
      <stop offset="1" stop-color="#030803"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7FF3C"/>
      <stop offset=".52" stop-color="#7CFF00"/>
      <stop offset="1" stop-color="#45b900"/>
    </linearGradient>
    <radialGradient id="knob" cx=".35" cy=".28" r=".85">
      <stop offset="0" stop-color="#303830"/>
      <stop offset=".5" stop-color="#0d120d"/>
      <stop offset="1" stop-color="#020402"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#7CFF00" opacity=".08"/>
    </pattern>
  </defs>

  <g id="radar" transform="translate(54 12)" fill="none" stroke="#7CFF00" opacity=".66">
    <path d="M30 176a128 128 0 0 1 256 0" stroke-width="3"/>
    <path d="M53 176a105 105 0 0 1 210 0" stroke-width="2"/>
    <path d="M78 176a80 80 0 0 1 160 0" stroke-width="2"/>
    <path d="M158 49v127M93 64l65 112M223 64l-65 112" stroke-width="1.4" opacity=".55"/>
    <path d="M286 176h35l14-12h44l13 12h65" stroke-width="2"/>
  </g>

  <g id="scanner" transform="translate(28 64)">
    <rect x="0" y="0" width="430" height="190" rx="24" fill="url(#body)" stroke="#192419" stroke-width="7"/>
    <rect x="7" y="7" width="416" height="176" rx="18" fill="none" stroke="#7CFF00" stroke-width="2" opacity=".7"/>
    <text x="24" y="31" fill="#f2f7f2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DESKTOP SCANNER</text>
    <text x="356" y="31" fill="#f2f7f2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">SDS200</text>

    <circle cx="42" cy="86" r="15" fill="#0b100b" stroke="#7CFF00" stroke-width="2"/>
    <path d="M42 76v11M36 80a9 9 0 1 0 12 0" fill="none" stroke="#B7FF3C" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="20" y="132" width="48" height="25" rx="5" fill="#171d17" stroke="#313b31"/>
    <text x="44" y="150" text-anchor="middle" fill="#edf7e8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">AVOID</text>

    <rect x="78" y="44" width="220" height="122" rx="7" fill="url(#screen)" stroke="#253125" stroke-width="5"/>
    <rect x="86" y="52" width="204" height="106" rx="3" fill="url(#scanlines)"/>
    <text x="98" y="80" fill="#B7FF3C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">MONITOR</text>
    <path d="M101 97l12 9-12 9z" fill="none" stroke="#7CFF00" stroke-width="2"/>
    <text x="122" y="113" fill="#B7FF3C" font-family="Arial, Helvetica, sans-serif" font-size="18">Scanning</text>
    <g fill="url(#word)">
      <rect x="194" y="124" width="11" height="12" rx="1"/>
      <rect x="209" y="116" width="11" height="20" rx="1"/>
      <rect x="224" y="106" width="11" height="30" rx="1"/>
      <rect x="239" y="94" width="11" height="42" rx="1"/>
      <rect x="254" y="80" width="11" height="56" rx="1"/>
    </g>
    <text x="230" y="151" text-anchor="middle" fill="#7CFF00" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">SIGNAL</text>
    <line x1="96" y1="140" x2="178" y2="140" stroke="#7CFF00" stroke-width="1" opacity=".4"/>

    <g font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">
      <text x="105" y="159" fill="#7CFF00">SYSTEM</text>
      <text x="145" y="159" fill="#7CFF00">DEPT</text>
      <text x="188" y="159" fill="#7CFF00">CHANNEL</text>
      <text x="240" y="159" fill="#7CFF00">HOLD</text>
      <text x="276" y="159" fill="#7CFF00">MENU</text>
    </g>

    <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">
      <g><rect x="304" y="44" width="48" height="24" rx="5" fill="#161d16" stroke="#2f3a2f"/><text x="328" y="60" text-anchor="middle" fill="#7CFF00">MENU</text></g>
      <g><rect x="304" y="72" width="48" height="24" rx="5" fill="#161d16" stroke="#2f3a2f"/><text x="328" y="88" text-anchor="middle" fill="#7CFF00">FUNC</text></g>
      <g><rect x="304" y="100" width="48" height="24" rx="5" fill="#161d16" stroke="#2f3a2f"/><text x="328" y="116" text-anchor="middle" fill="#7CFF00">SCAN</text></g>
      <g><rect x="304" y="128" width="48" height="24" rx="5" fill="#161d16" stroke="#2f3a2f"/><text x="328" y="144" text-anchor="middle" fill="#7CFF00">SEARCH</text></g>
    </g>

    <circle cx="386" cy="92" r="36" fill="url(#knob)" stroke="#7CFF00" stroke-width="3"/>
    <circle cx="386" cy="92" r="29" fill="none" stroke="#4a584a" stroke-width="1"/>
    <path d="M368 71a26 26 0 0 1 25-5" stroke="#8e9d8e" stroke-width="2" opacity=".35"/>

    <rect x="34" y="181" width="55" height="12" rx="4" fill="#050805"/>
    <rect x="338" y="181" width="55" height="12" rx="4" fill="#050805"/>
  </g>

  <g id="wordmark" transform="translate(486 0)">
    <line x1="0" y1="160" x2="686" y2="160" stroke="#7CFF00" stroke-width="2" filter="url(#softGlow)"/>
    <text x="0" y="145" fill="url(#word)" filter="url(#softGlow)" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="1">SDS200-PYTHON</text>
    <text x="12" y="201" fill="#B7FF3C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="8">CONTROL. MONITOR. AUTOMATE.</text>
    <text x="15" y="239" fill="#7CFF00" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" letter-spacing="6">PUBLIC SAFETY SCANNER • POWERED BY PYTHON</text>
    <circle cx="685" cy="160" r="5" fill="#B7FF3C" filter="url(#glow)"/>
  </g>
</svg>
