services:
  daemon:
    build:
      context: .
    network_mode: host
    restart: unless-stopped
    command:
      - --log-level
      - "${SDS200_LOG_LEVEL:-INFO}"
      - --host
      - "${SDS200_HOST:?Set SDS200_HOST to the scanner IPv4 address}"
      - daemon
    volumes:
      - config:/config
      - state:/state
      - cache:/cache
      - runtime:/run/sdsctl

  daemon-client:
    profiles:
      - client
    build:
      context: .
    entrypoint:
      - sdsctl
      - daemon-client
    network_mode: none
    healthcheck:
      disable: true
    volumes:
      - runtime:/run/sdsctl

  web-dashboard:
    profiles:
      - web
    build:
      context: .
    entrypoint:
      - sdsctl
      - web
    network_mode: none
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - runtime:/run/sdsctl

volumes:
  config:
  state:
  cache:
  runtime:
