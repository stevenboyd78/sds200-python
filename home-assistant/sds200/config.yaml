name: "sds200"
version: "0.20.1"
slug: "sds200"
description: "Uniden SDS200 scanner daemon and web dashboard for Home Assistant"
arch:
  - aarch64
  - amd64
url: "https://github.com/stevenboyd78/sds200-python"
image: "ghcr.io/stevenboyd78/sds200-home-assistant"
startup: application
boot: auto
stage: experimental
init: false
services:
  - "mqtt:need"
map:
  - type: media
    read_only: false
ingress: true
ingress_port: 8099
ingress_stream: true
ports:
  50000/udp: 50000
ports_description:
  50000/udp: "SDS200 RTP audio"
panel_title: "sds200"
panel_icon: "mdi:radio-tower"
timeout: 60
options:
  mqtt_topic_prefix: "sdsctl"
  recording_directory: "sdsctl/recordings"
schema:
  scanner_host: "str(1,)"
  mqtt_topic_prefix: "str(1,)"
  recording_directory: "str(1,)"
